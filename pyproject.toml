[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihsg-global-correlation"
version = "0.1.0"
description = "Korelasi IHSG dengan indeks global, FX, sentimen, dan komoditas"
requires-python = ">=3.10"
dependencies = []  # dependensi dikelola lewat environment.yml

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
