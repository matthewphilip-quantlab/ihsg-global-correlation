# =============================================================================
# Konfigurasi seri untuk project korelasi IHSG vs indeks global
# Menambah / memindahkan seri cukup di file ini — kode tidak perlu dibongkar.
#
# Field per seri:
#   id        : nama pendek (dipakai sebagai nama kolom)
#   ticker    : simbol sumber data (Yahoo Finance kecuali `source` diisi lain)
#   category  : index | etf | fx | sentiment | macro | commodity | stock
#   session   : target | sync  (tutup sebelum/bersamaan IHSG ~16:00 WIB)
#                      | after (tutup setelah IHSG -> efeknya baru terlihat t+1)
#   transform : log (log return) | diff (selisih level, untuk yield)
#   source    : yfinance (default) | fred
# =============================================================================

project:
  # Target aktif. Ganti ke id lain dari blok `targets` (mis. BBCA) untuk menjalankan ulang pipeline
  # tanpa mengubah kode. Output target selain primary_target ditulis ke reports/targets/<id>/ dan
  # data/processed/targets/<id>/ supaya hasil IHSG tidak tertimpa.
  target_id: JKSE
  primary_target: JKSE
  start_date: "2007-01-01"       # ideal: mencakup Krisis Finansial Global 2008
  fallback_start: "2010-01-01"   # dipakai kalau target tidak lengkap sejak start_date
  # BEI menghentikan perdagangan setelah 8 Okt 2008 dan buka lagi 13 Okt 2008.
  # Berlaku untuk semua target yang listing di BEI: diperlakukan sebagai hari libur, bukan data bolong.
  suspended_days: ["2008-10-09", "2008-10-10"]
  end_date: null                 # null = sampai data terbaru
  # DIKUNCI. Periode ini hanya untuk screening / pemilihan seri.
  # Data 2007-2009 dan 2020+ tidak boleh dipakai untuk memilih ulang seri.
  screening_window: ["2010-01-01", "2019-12-31"]

quality:
  # |return harian| di atas ambang ini = "gerakan besar" (log return; yield = poin persen).
  # Ambang per kategori supaya VIX tidak jadi false positive.
  spike_threshold:
    index: 0.12
    etf: 0.12
    fx: 0.05
    sentiment: 0.60
    macro: 0.40
    commodity: 0.20
    stock: 0.25                  # saham BEI (Phase 7); hanya untuk menandai, tidak ada yang dibuang
  # Gerakan besar yang besoknya dibalik >= 50% ke arah sebaliknya = dugaan bad tick.
  reversal_ratio: 0.5
  min_obs_per_year: 200          # normal ~240-250 hari bursa/tahun
  max_gap_days: 14               # jeda kalender antar observasi di atas ini = gap panjang
  start_tolerance_days: 30
  # Batas (% hari) sebelum modul gap pembukaan / intraday fallback ke close-to-close
  open_checks:
    missing_pct: 2.0             # Open kosong / <= 0
    outside_range_pct: 1.0       # Open di luar rentang Low-High
    open_eq_prev_close_pct: 5.0  # Open = Close kemarin (gap nol palsu)
    flat_bar_pct: 5.0            # Open = High = Low = Close (OHLC diisi dari Close)
  min_years_open_module: 5       # minimal panjang periode kalau modul hanya valid sebagian
  # README poin 9: return ex-date dengan dividen tunai > ambang ini (fraksi close tanpa penyesuaian sebelumnya) = NaN
  # di analisis harian & mingguan, khusus target berkategori stock. Hasil tanpa aturan = sensitivitas.
  large_dividend_frac: 0.10
  # Cleaning FX (README poin 4 + Amandemen 1, DIKUNCI). Ambang = spike_threshold.fx, rasio = reversal_ratio.
  fx_cleaning:
    max_reversal_days: 5         # Amandemen 1 (MENGIKAT): pembalikan boleh dalam <= 5 hari bursa
    max_reversal_days_old: 1     # aturan awal poin 4; hanya untuk sensitivitas, tidak mengikat
  # Kuotasi basi FX: nilai yang persis berulang >= min_count kali. HANYA DITANDAI, tidak dibuang
  # (cara menanganinya untuk analisis harian diputuskan sebelum Phase 4).
  stale_quote:
    min_count: 10
    tol_pct: 0.05                # hari dengan harga dalam +-0.05% dari nilai berulang ikut ditandai

# Uji ulang USD/IDR (README poin 4). Periode = project.screening_window, metode = scripts/screening.py.
usdidr_retest:
  id: USDIDR
  target_id: JKSE                # keputusan dikunci terhadap IHSG; target lain tidak menjalankan ulang uji ini
  min_abs_corr: 0.300            # |r| dipotong 3 desimal (tanpa pembulatan ke atas)

# Phase 3: parameter analisis deskriptif (rencana dikunci di README "Rencana teknik per phase")
analysis:
  post_screening_start: "2020-01-01"   # periode pasca-screening = tanggal ini s/d akhir data
  vif_threshold: 5.0                   # VIF di atas ini -> laporkan beta regresi satu faktor sebagai pembanding
  scenario:                            # cara membaca beta: guncangan seri -> perubahan IHSG (log return mingguan)
    default_shock_pct: 1
    by_id:
      USDIDR: {shock_pct: 1, phrase: "rupiah melemah 1% (USD/IDR naik 1%)"}
      VIX:    {shock_pct: 10, phrase: "VIX naik 10%"}
  asymmetric:
    condition_ids: [SPX, EEM]          # "minggu global turun vs naik" = tanda return mingguan seri ini
    exceedance_q: 0.10                 # minggu ekstrem: <= persentil 10 vs >= persentil 90
    n_boot: 1000                       # stationary block bootstrap untuk selisih
    mean_block_weeks: 4
    n_mc: 200000                       # simulasi normal multivariat untuk korelasi kondisional yang diharapkan
    seed: 42
  # Uji ulang hipotesis screening "korelasi USD/IDR menguat dari 2010-2014 ke 2015-2019"
  usdidr_subperiods: [["2010-01-01", "2014-12-31"], ["2015-01-01", "2019-12-31"]]
  # Phase 4: semua estimasi hanya s/d akhir project.screening_window (2019-12-31); data 2020+ tidak disentuh.
  leadlag:
    max_k: 5                           # cross-correlation IHSG(t+k) vs seri(t), k = -max_k..+max_k
    granger_maxlags: 5
    granger_ic: bic                    # mengikat (rencana dikunci); AIC dilaporkan sebagai pembanding
    eido_id: EIDO
    eido_compare_ids: [SPX, EEM]       # apakah EIDO membawa informasi tambahan di luar seri ini?
    coint_alpha: 0.05

# Phase 5: regime & krisis (DESKRIPTIF; tidak boleh mengubah Spesifikasi Phase 6). Jangkar & jendela dari README.
regime:
  rolling_weeks: [52, 156]
  rolling_min_frac: 0.8              # minimal 80% minggu tersedia di dalam jendela rolling
  post_break: "2020-01-01"           # untuk menjawab: pergeseran pasca-2020 tren atau lonjakan sesaat?
  window_days: [-20, 60]             # hari bursa IHSG di sekitar jangkar (hari 0 = hari bursa pertama >= jangkar)
  pre_days: 250                      # pembanding korelasi: 250 hari bursa IHSG yang berakhir sebelum jendela
  episodes:                          # prinsip: guncangan global yang menular ke pasar emerging
    "2008": "2008-09-15"             # Lehman
    "2013": "2013-05-22"             # taper tantrum
    "2015": "2015-08-11"             # devaluasi yuan
    "2018": "2018-08-10"             # krisis lira Turki / penularan EM
    "2020": "2020-03-11"             # WHO: pandemi
    "2022": "2022-02-24"             # invasi Rusia ke Ukraina
  sensitivity: {"2018": "2018-02-05"}    # dijalankan ulang menggantikan jangkar 2018, berlabel
  descriptive_only: {"2026": "2026-10-16"}   # jangkar dari IHSG sendiri; terpotong; DIKELUARKAN dari ringkasan
  event_ids: [KLCI, STI, EEM]        # dibandingkan dengan target
  quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  brent_id: BRENT
  qr_controls: [COPPER, EEM]         # kontrol permintaan global
  brent_spike_pct: 90                # lonjakan Brent = return mingguan > persentil ini (dihitung di 2010-2019)
  safe_haven_ids: [GOLD, DXY, UST10Y]   # dari blok `nanti`, hanya untuk analisis; Core tidak berubah
  idr_derived: [GOLD]                # juga dihitung dalam rupiah (x USD/IDR bersih): sudut pandang investor Indonesia

# Phase 6: uji out-of-sample. Mengikuti README "Spesifikasi Phase 6 (dikunci sebelum Phase 5)" PERSIS.
oos:
  train_start: "2010-01-01"          # expanding window mulai di sini
  oos_start: "2020-01-01"            # OOS s/d data terakhir; refit bulanan
  main_features: [EEM, SPX, VIX]     # + Δpremium EIDO (eido_id) + kontrol target(t)
  sensitivity_features: [EEM, SPX, NIFTY, VIX, COPPER, BRENT]   # Granger-signifikan di Phase 4; + kontrol target(t)
  eido_id: EIDO
  label_eido_trend: "spesifikasi dipilih setelah melihat hasil Phase 4"
  label_added_after_phase5: "ditambahkan setelah Phase 5, deskriptif"
  subperiods: [["2020-01-01", "2022-12-31"], ["2023-01-01", null]]
  calibration_bins: 10
  placebo_seeds: 10                  # uji target diacak: jumlah pengacakan
  har_weeks: [1, 4, 13]              # HAR-X mingguan: lag RV 1, 4, 13 minggu
  vix_id: VIX

# Phase 7: demonstrasi pipeline big cap (target saham; Core, aturan, dan periode sama dengan IHSG)
bigcap:
  targets: [BBCA, BBRI, TLKM, PTBA, ASII]
  factors: [USDIDR, EEM]             # beta satu faktor (+ IHSG = project.primary_target sebagai beta pasar)
  asym_id: EEM                       # korelasi asimetris vs seri ini
  lead_id: EEM                       # lead harian saham(t+1) ~ seri ini(t) + Δpremium EIDO(t)

# Seri turunan: target dalam USD = target / USD/IDR (yang sudah dibersihkan). id = <target_id><suffix>
target_usd:
  suffix: _USD
  fx_id: USDIDR

# Angka referensi 2008 per target untuk validasi data Yahoo (bukan untuk analisis).
# Key = id target; target tanpa entri -> sanity check dilewati. Hari suspend diambil dari project.suspended_days.
# Sumber: catatan pengguna; status FAIL berarti salah satu sisi (Yahoo atau referensi) perlu dicek.
sanity_checks:
  JKSE:
    peak:   {date: "2008-01-09", close: 2830.0, tol_pct: 1.0}
    trough: {date: "2008-10-28", close: 1111.0, tol_pct: 1.0}
    daily_drops:
      - {date: "2008-10-06", ret_pct: -10.03, tol_pp: 0.5}
      - {date: "2008-10-08", ret_pct: -10.38, tol_pp: 0.5}

# -----------------------------------------------------------------------------
