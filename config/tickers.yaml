  # Phase 7: 5 big cap (keputusan 21 Okt 2026: PTBA menggantikan ADRO; ADRO & ANTM di luar, alasan di README).
  - {id: BBCA, ticker: "BBCA.JK", name: Bank Central Asia,   category: stock, session: target, transform: log}
  - {id: BBRI, ticker: "BBRI.JK", name: Bank Rakyat Indonesia, category: stock, session: target, transform: log}
  - {id: TLKM, ticker: "TLKM.JK", name: Telkom Indonesia,    category: stock, session: target, transform: log}
  - {id: PTBA, ticker: "PTBA.JK", name: Bukit Asam,          category: stock, session: target, transform: log,
     note: "Pengganti ADRO. Dividen 26 Jun 2023 (+-30% harga) membuat return adjusted Yahoo +6,2 pp di atas total return"}
  - {id: ASII, ticker: "ASII.JK", name: Astra International, category: stock, session: target, transform: log}

# 10 seri Core (hasil screening 2010-2019 + override yang alasannya ada di README)
core:
  - {id: STI,    ticker: "^STI",   name: Straits Times,       category: index,     session: sync,  transform: log}
  - {id: KLCI,   ticker: "^KLSE",  name: KLCI Malaysia,       category: index,     session: sync,  transform: log}
  - {id: EEM,    ticker: "EEM",    name: iShares MSCI EM,     category: etf,       session: after, transform: log}
  - {id: SPX,    ticker: "^GSPC",  name: S&P 500,             category: index,     session: after, transform: log}
  - {id: NIFTY,  ticker: "^NSEI",  name: Nifty 50,            category: index,     session: after, transform: log}
  - {id: HSI,    ticker: "^HSI",   name: Hang Seng,           category: index,     session: sync,  transform: log,
     override: true, note: "Override: isolasi channel China; lihat README"}
  - {id: VIX,    ticker: "^VIX",   name: VIX,                 category: sentiment, session: after, transform: log}
  - {id: COPPER, ticker: "HG=F",   name: Tembaga,             category: commodity, session: after, transform: log}
  - {id: BRENT,  ticker: "BZ=F",   name: Brent,               category: commodity, session: after, transform: log,
     override: true, note: "Override: channel migas; hipotesis regime; lihat README",
     label: "dipilih dengan pengetahuan periode uji"}
  - {id: USDIDR, ticker: "IDR=X",  name: USD/IDR,             category: fx,        session: after, transform: log,
     status: driver, note: "Driver: lolos uji ulang Phase 2 (|r| mingguan 2010-2019 pasca-cleaning Amandemen 1 = 0.334 >= 0.300; aturan lama 0.189); lihat README poin 4"}

# Alat bantu analisis (bukan driver)
tools:
